AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TicketRush – CloudFront distribution with Origin Access Control (OAC)
  for the S3 frontend bucket, and /api/* forwarded to ALB.
  Enables HTTPS-only access and prevents Mixed Content errors.
  Deploys: CloudFront distribution, OAC, S3 bucket policy update.

Parameters:
  FrontendBucketName:
    Type: String
    Description: Name of the S3 bucket hosting the static frontend.
    Default: ticketrush-frontend

  AlbDnsName:
    Type: String
    Description: DNS name of the Application Load Balancer (e.g. alb-xxx.ap-southeast-1.elb.amazonaws.com).

  AcmCertificateArn:
    Type: String
    Description: >
      ARN of the ACM certificate (us-east-1) for the custom domain.
      Leave empty to use the default CloudFront domain (*.cloudfront.net) without a custom domain.
    Default: ""

  CustomDomainName:
    Type: String
    Description: Optional custom domain (e.g. ticketrush.io). Leave empty to skip.
    Default: ""

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]

Resources:

  # ── 1. Origin Access Control (replaces legacy OAI) ────────────────────────
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${FrontendBucketName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: "OAC for TicketRush S3 frontend bucket"

  # ── 2. CloudFront Distribution ────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "TicketRush — static frontend + API proxy"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100   # US/EU/Asia edges (lowest latency for AP)

        # Custom domain (optional)
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue

        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # ── Origins ──────────────────────────────────────────────────────────
        Origins:
          # Origin 1: S3 bucket (static files) — Block Public Access ON
          - Id: S3FrontendOrigin
            DomainName: !Sub "${FrontendBucketName}.s3.ap-southeast-1.amazonaws.com"
            S3OriginConfig: {}           # required when using OAC
            OriginAccessControlId: !GetAtt FrontendOAC.Id

          # Origin 2: ALB (FastAPI backend)
          - Id: ALBOrigin
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

        # ── Cache Behaviours ─────────────────────────────────────────────────

        # /api/* → ALB (no cache; forward all headers + cookies)
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (AWS managed)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            Compress: false

        # Default → S3 (static assets; cache 1 day)
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (AWS managed)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy

        # SPA — return index.html on 403/404 (S3 returns 403 for missing paths)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 10

        Logging:
          Bucket: !Sub "${FrontendBucketName}-logs.s3.amazonaws.com"
          IncludeCookies: false
          Prefix: cloudfront/

  # ── 3. S3 Bucket Policy — allow OAC only (Block Public Access stays ON) ──
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

Outputs:
  CloudFrontDomain:
    Description: "CloudFront distribution domain — set as CNAME for your custom domain"
    Value: !GetAtt CloudFrontDistribution.DomainName

  DistributionId:
    Description: "CloudFront Distribution ID (needed for cache invalidations)"
    Value: !Ref CloudFrontDistribution

  OACId:
    Description: "Origin Access Control ID"
    Value: !GetAtt FrontendOAC.Id
