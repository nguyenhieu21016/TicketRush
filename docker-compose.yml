version: '3.8'

services:
  # CSDL MySQL (Mô phỏng Amazon RDS MySQL của Nguyễn Văn Hiếu)
  mysql:
    image: mysql:8.0
    container_name: ticketrush_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticketrush_db
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Bộ đếm Redis (Mô phỏng Amazon ElastiCache Redis)
  redis:
    image: redis:7-alpine
    container_name: ticketrush_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
