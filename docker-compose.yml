services:
  db:
    image: mysql:8.0
    container_name: ticketrush-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketrush}
      MYSQL_USER: ${MYSQL_USER:-ticketrush_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ticketrush_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount schema và migrations để tự động khởi tạo bảng theo đúng thứ tự
      - ./database/schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
      - ./database/migrations/001_create_bookings.sql:/docker-entrypoint-initdb.d/001_create_bookings.sql:ro
      - ./database/migrations/002_update_tickets.sql:/docker-entrypoint-initdb.d/002_update_tickets.sql:ro
      - ./database/migrations/003_add_event_status.sql:/docker-entrypoint-initdb.d/003_add_event_status.sql:ro
      - ./database/migrations/004_add_ticket_tiers.sql:/docker-entrypoint-initdb.d/004_add_ticket_tiers.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketrush-net

  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ticketrush-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketrush-backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketrush-net

volumes:
  mysql_data:
  redis_data:

networks:
  ticketrush-net:
    driver: bridge
